        /* THE GRID SYSTEM (Fixed for Symmetry) */
        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }

        /* ANIME CARD STYLING */
        .anime-card { background: #1f2833; border-radius: 12px; overflow: hidden; border: 1px solid #45a29e; transition: transform 0.3s ease, box-shadow 0.3s ease; display: flex; flex-direction: column; }

        .anime-card img { width: 100%; height: 300px; object-fit: cover; object-position: center; }
        
        .card-info { padding: 12px; flex-grow: 1; text-align: center; }
        .card-info h3 { font-size: 15px; margin-bottom: 10px; height: 36px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

        /* FOOTER */
