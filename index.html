        /* CSS RESET & THEME */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0b0c10; font-family: 'Inter', sans-serif; color: #ffffff; line-height: 1.6; }

        /* HEADER SECTION */
        header { background: #1f2833; padding: 20px; text-align: center; border-bottom: 2px solid #66fcf1; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 24px; font-weight: bold; color: #66fcf1; text-transform: uppercase; letter-spacing: 2px; }

        /* AD PLACEMENT STYLING */
        .ad-container { width: 100%; max-width: 728px; margin: 15px auto; min-height: 90px; background: #1a1a1a; display: flex; align-items: center; justify-content: center; border: 1px dashed #444; color: #666; font-size: 12px; }

        /* MAIN CONTENT AREA */

        .section-title { font-size: 20px; margin-bottom: 20px; border-left: 4px solid #66fcf1; padding-left: 10px; }

        /* THE GRID SYSTEM */
        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }

        /* ANIME CARD STYLING */
        .anime-card { background: #1f2833; border-radius: 12px; overflow: hidden; border: 1px solid #45a29e; transition: transform 0.3s ease, box-shadow 0.3s ease; display: flex; flex-direction: column; }
        .anime-card:hover { transform: translateY(-8px); box-shadow: 0 10px 20px rgba(102, 252, 241, 0.2); }
        .anime-card img { width: 100%; height: 230px; object-fit: cover; }
        
        .card-info { padding: 12px; flex-grow: 1; text-align: center; }
        .card-info h3 { font-size: 15px; margin-bottom: 10px; height: 36px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

        /* WATCH BUTTON */
        .watch-btn { display: inline-block; background: #66fcf1; color: #0b0c10; text-decoration: none; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 13px; width: 100%; transition: background 0.2s; }
        .watch-btn:hover { background: #45a29e; }

        /* FOOTER */
        footer { margin-top: 50px; padding: 30px; text-align: center; background: #0b0c10; color: #555; font-size: 12px; border-top: 1px solid #1f2833; }
