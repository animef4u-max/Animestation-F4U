    <style>
        /* CSS RESET & THEME */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0b0c10; font-family: 'Inter', sans-serif; color: #ffffff; margin: 0; position: relative; }

        /* FIXED BACKGROUND */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(11, 12, 16, 0.7), rgba(11, 12, 16, 0.7)), 
                        url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSypcqofGnbnTnyA4DPiKGlKi5olM1LRfnXoQ&s'); 
            background-size: cover; background-position: center; filter: blur(8px); z-index: -1; transform: scale(1.1);
        }
        
        header { background: #1f2833; padding: 20px; text-align: center; border-bottom: 2px solid #66fcf1; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 24px; font-weight: bold; color: #66fcf1; text-transform: uppercase; letter-spacing: 2px; }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .section-title { font-size: 20px; margin-bottom: 20px; border-left: 4px solid #66fcf1; padding-left: 10px; }

        /* THE GRID SYSTEM */
        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }

        /* ANIME CARD STYLING */
        .anime-card { background: #1f2833; border-radius: 12px; overflow: hidden; border: 1px solid #45a29e; transition: transform 0.3s ease; display: flex; flex-direction: column; }
        .anime-card:hover { transform: translateY(-8px); }
        .anime-card img { width: 100%; height: 300px; object-fit: cover; object-position: center; }
        
        .card-info { padding: 12px; flex-grow: 1; text-align: center; }
        .card-info h3 { font-size: 15px; margin-bottom: 10px; height: 36px; overflow: hidden; }

        .watch-btn { display: inline-block; background: #66fcf1; color: #0b0c10; text-decoration: none; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 13px; width: 100%; }

        .ad-container { width: 100%; max-width: 728px; margin: 20px auto; min-height: 90px; background: #1a1a1a; display: flex; align-items: center; justify-content: center; border: 1px dashed #444; }

        /* CONTENT LOCKER OVERLAY */
        #locker-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 12, 16, 0.98); backdrop-filter: blur(15px);
            display: flex; align-items: center; justify-content: center; z-index: 9999; text-align: center;
        }
        .locker-content { background: #1f2833; padding: 30px; border-radius: 15px; border: 2px solid #66fcf1; box-shadow: 0 0 20px #66fcf1; max-width: 90%; }
        .unlock-btn { display: inline-block; margin-top: 20px; background: #66fcf1; color: #0b0c10; padding: 12px 25px; text-decoration: none; font-weight: bold; border-radius: 8px; cursor: pointer; }

        footer { margin-top: 50px; padding: 30px; text-align: center; background: #0b0c10; color: #555; font-size: 12px; border-top: 1px solid #1f2833; }
    </style>
